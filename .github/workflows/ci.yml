# Intégration continue : lint, tests, parcours Playwright, image Docker (T-18).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-uniquement
  DATABASE_URL: postgres://dianna:dianna@localhost:5432/dianna

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: make lint
      - run: make check

  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: dianna
          POSTGRES_USER: dianna
          POSTGRES_PASSWORD: dianna
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dianna -d dianna"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      # Exports PDF (WeasyPrint) : bibliothèques natives.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      # Stockage S3 des justificatifs (L5-02) : MinIO, chiffrement côté serveur activé.
      # Les images officielles de MinIO ne sont plus publiées : image Bitnami figée, épinglée
      # par son empreinte (bitnamilegacy/minio:2025.7.23). À remplacer au lot 8.
      - name: MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=dianna -e MINIO_ROOT_PASSWORD=dianna-secret \
            -e MINIO_KMS_SECRET_KEY="dianna-key:$(openssl rand -base64 32)" \
            -e MINIO_DEFAULT_BUCKETS=dianna-ci \
            bitnamilegacy/minio@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 2; done
      - run: make test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: dianna
          S3_TEST_SECRET_KEY: dianna-secret
      - run: uv run playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dianna:ci .
      # Les bibliothèques natives de WeasyPrint sont présentes dans l'image.
      - run: docker run --rm dianna:ci python -c "import weasyprint; assert weasyprint.HTML(string='<p>ok</p>').write_pdf().startswith(b'%PDF')"
      - name: Taille de l'image (octets)
        run: docker image inspect dianna:ci --format "{{.Size}}"
