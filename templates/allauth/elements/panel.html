{% load allauth %}
<section class="card card-body flex flex-col gap-3">
  <h2 class="h2">{% slot title %}{% endslot %}</h2>
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <div class="actions">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </div>
  {% endif %}
</section>
