{% load i18n %}{% with label=cell.label day_text=cell.day|date:"l j F"|capfirst %}
<td class="{% if cell.state == 'we' %}we{% endif %}{% if cell.day == today %} today{% endif %}" title="{{ row.employee.full_name }} · {{ day_text }} · {{ label|default:_('Week-end') }}">
  {% if cell.clickable %}
    <button class="plan-cell" type="button" hx-get="{{ new_telework_url }}?date={{ cell.day|date:'Y-m-d' }}" hx-target="#modal-root" aria-label="{% blocktranslate %}{{ day_text }} : {{ label }}. Déclarer du télétravail{% endblocktranslate %}">
  {% else %}
    <span class="sr-only">{{ day_text }} : {{ label|default:_("Week-end") }}</span>
  {% endif %}
  {% if cell.state != "we" %}
    <span class="cell {% if view == 'mois' %}m{% else %}wk{% endif %} k-{{ cell.state }}{% if cell.pending %} pend{% endif %}" aria-hidden="true">{% if view == "mois" %}{{ cell.letter }}{% elif cell.state == "off" %}{{ cell.day_off_label }}{% elif cell.state == "none" %}—{% else %}{{ cell.state_label }}{% endif %}{% if cell.on_call %}<span class="cell-oncall{% if cell.on_call_pending %} pend{% endif %}">A</span>{% endif %}</span>
  {% elif cell.on_call %}
    <span class="cell {% if view == 'mois' %}m{% else %}wk{% endif %} k-we" aria-hidden="true"><span class="cell-oncall{% if cell.on_call_pending %} pend{% endif %}">A</span></span>
  {% endif %}
  {% if cell.clickable %}</button>{% endif %}
</td>
{% endwith %}
